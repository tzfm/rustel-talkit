name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, runner: ubuntu-24.04 }
          - { name: macOS arm64, runner: macos-latest }
          - { name: Windows x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy without playback
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Test without playback
        run: cargo test --locked --no-default-features

  result:
    name: CI result
    if: always()
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when a required job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
